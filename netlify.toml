# =====================================================================
# Netlify 构建配置 — 信息安全测评实践教学平台
# 说明：publish 指向仓库根；netlify/functions 目录会被自动识别为
#       无服务器函数，且不会作为静态文件对外发布。
# =====================================================================
[build]
  publish = "."
  functions = "netlify/functions"

# 函数运行时的 Node 主版本（Netlify 默认已是 18+，此处可留默认）
[functions]
  node_bundler = "zisi"
