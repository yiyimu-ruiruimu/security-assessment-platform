# =====================================================================
# Netlify 构建配置 — 信息安全测评实践教学平台
# 说明：publish 指向仓库根；netlify/functions 目录会被自动识别为
#       无服务器函数。
#       注意：请勿把 AI 过程产物、开发备份、源工程文件提交进仓库，
#       它们会随 publish="." 一起发布，拖大部署体积并可能导致部署失败。
# =====================================================================
[build]
  publish = "."
  functions = "netlify/functions"

# 函数打包器（esbuild 为 Netlify 当前默认与推荐值）
[functions]
  node_bundler = "esbuild"
