<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日志管理后台 - 信息安全测评与风险评估实践教学平台</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    body { background: #f5f7fa; color: #333; line-height: 1.6; padding: 20px; }
    header { max-width: 1180px; margin: 0 auto 16px; background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%); color: #fff; padding: 20px 28px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    header h1 { font-size: 1.3rem; font-weight: 600; }
    header .sub { font-size: 0.88rem; opacity: 0.9; margin-top: 3px; font-weight: 300; }
    .topbar { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; }
    .topbar a { color: #fff; text-decoration: none; background: rgba(255,255,255,0.16); padding: 6px 14px; border-radius: 8px; }
    .topbar a:hover { background: rgba(255,255,255,0.28); }
    .card { max-width: 1180px; margin: 0 auto 16px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 20px 24px; }
    .msg { display: none; margin-bottom: 16px; padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; }
    .msg.info { background: #e8f4fd; color: #0c447c; border: 1px solid #b5d4f4; }
    .msg.err { background: #fdecea; color: #a93226; border: 1px solid #f5c6c2; }
    .msg.ok { background: #eef9ee; color: #1e7e34; border: 1px solid #c8e6c9; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .f-item { display: flex; flex-direction: column; gap: 4px; }
    .f-item label { font-size: 0.8rem; color: #6b7a8d; }
    .f-item input, .f-item select { border: 1px solid #cfd8e3; border-radius: 8px; padding: 8px 10px; font-size: 0.9rem; min-width: 150px; background: #fff; color: #333; }
    .btn { border: none; border-radius: 8px; padding: 9px 20px; font-size: 0.92rem; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: #0d47a1; color: #fff; }
    .btn-primary:hover { background: #0b3d8a; }
    .btn-outline { background: #fff; color: #1565c0; border: 1px solid #1565c0; }
    .btn-outline:hover { background: #eef4fd; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .stat { margin: 16px 0 10px; font-size: 0.88rem; color: #6b7a8d; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th { background: #f0f4f9; color: #0c447c; text-align: left; padding: 9px 10px; border-bottom: 2px solid #dde4ec; white-space: nowrap; }
    td { padding: 8px 10px; border-bottom: 1px solid #eef1f5; vertical-align: top; }
    tr:hover td { background: #f8fafd; }
    .b { display: inline-block; font-size: 0.76rem; border-radius: 20px; padding: 2px 10px; white-space: nowrap; }
    .b-login { background: #e6f1fb; color: #185fa5; }
    .b-entry { background: #eaf3de; color: #3b6d11; }
    .b-operation { background: #eeedfe; color: #534ab7; }
    .b-logout { background: #faeeda; color: #854f0b; }
    .b-other { background: #f1efef; color: #5f5e5a; }
    .empty { text-align: center; color: #95a5b6; padding: 30px 0; }
    .pager { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
    .email-cell { color: #1565c0; word-break: break-all; }
    .detail-cell { max-width: 340px; word-break: break-all; }
    .muted { color: #95a5b6; }
</style>
</head>
<body>
<header>
    <div>
        <h1>日志管理后台</h1>
        <div class="sub">信息安全测评与风险评估实践教学平台 · 学生考勤与操作记录</div>
    </div>
    <div class="topbar" id="topbar">
        <span id="barEmail" style="opacity:0.95;"></span>
        <a href="index.html">返回平台</a>
        <a href="login.html">登录门户</a>
        <a href="#" onclick="logout();return false;" style="background:rgba(229,62,62,0.75);">退出</a>
    </div>
</header>

<div class="card" id="stateCard">
    <div class="msg" id="msgBox"></div>
    <div id="guestView" style="text-align:center; padding:18px 0;">
        <p style="font-size:1.05rem; color:#2c3e50;">日志后台仅限教师账号访问</p>
        <p class="muted" style="margin:8px 0 18px; font-size:0.9rem;">请使用已在平台注册、并被添加为管理员的邮箱登录</p>
        <button class="btn btn-primary" onclick="doLogin()">教师账号登录</button>
    </div>
    <div id="deniedView" style="display:none; text-align:center; padding:18px 0;">
        <p style="font-size:1.05rem; color:#a93226;">无访问权限</p>
        <p class="muted" style="margin:8px 0 0; font-size:0.9rem;">当前账号不是教师管理员。请联系平台负责人在 Netlify 环境变量 ADMIN_EMAILS 中加入您的邮箱。</p>
    </div>

    <div id="mainView" style="display:none;">
        <div class="filters">
            <div class="f-item"><label>学生邮箱</label><input id="fEmail" type="text" placeholder="完整或留空查全部"></div>
            <div class="f-item"><label>事件类型</label>
                <select id="fType">
                    <option value="">全部</option>
                    <option value="login">登录</option>
                    <option value="entry">进入平台</option>
                    <option value="operation">操作</option>
                    <option value="logout">登出</option>
                </select>
            </div>
            <div class="f-item"><label>开始日期</label><input id="fFrom" type="date"></div>
            <div class="f-item"><label>结束日期</label><input id="fTo" type="date"></div>
            <div class="f-item"><label>每页</label>
                <select id="fLimit">
                    <option value="50">50</option>
                    <option value="100" selected>100</option>
                    <option value="200">200</option>
                </select>
            </div>
            <div class="f-item"><button class="btn btn-primary" onclick="search(0)">查询</button></div>
            <div class="f-item"><button class="btn btn-outline" onclick="exportCsv()">导出 CSV</button></div>
        </div>
        <div class="stat">
            <span id="statInfo">加载中……</span>
            <span id="statBadge"></span>
        </div>
        <table>
            <thead>
                <tr><th style="width:150px;">时间</th><th style="width:190px;">邮箱</th><th style="width:84px;">类型</th><th style="width:130px;">动作</th><th>明细</th><th style="width:110px;">IP</th></tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="6" class="empty">暂无数据</td></tr>
            </tbody>
        </table>
        <div class="pager">
            <button class="btn btn-outline" id="btnPrev" onclick="search(currentPage - 1)">上一页</button>
            <button class="btn btn-outline" id="btnNext" onclick="search(currentPage + 1)">下一页</button>
        </div>
    </div>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="auth-utils.js"></script>
<script>
(function () {
    'use strict';

    var currentPage = 0;
    var currentRows = [];
    var maxRows = 0;                 // 已拉到的最大 offset（无总数列，用结果数判断是否还有下一页）
    var busy = false;

    var TYPE_LABEL = { login: '登录', entry: '进入平台', operation: '操作', logout: '登出' };

    function $(id) { return document.getElementById(id); }
    function onReady(cb) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', cb); else cb(); }

    function showMsg(kind, text) {
        var m = $('msgBox');
        m.className = 'msg ' + kind;
        m.textContent = text;
        m.style.display = 'block';
    }
    function clearMsg() { $('msgBox').style.display = 'none'; }

    function currentUser() {
        try { if (typeof netlifyIdentity !== 'undefined') return netlifyIdentity.currentUser() || null; } catch (e) { /* noop */ }
        return null;
    }

    function doLogin() {
        if (typeof netlifyIdentity === 'undefined') { showMsg('err', '登录组件未加载：请先部署到 Netlify 并开启 Identity 服务。'); return; }
        netlifyIdentity.open('login');
    }

    function fmtTime(iso) {
        if (!iso) return '-';
        try {
            var d = new Date(iso);
            if (isNaN(d.getTime())) return iso;
            return d.toLocaleString('zh-CN', { hour12: false });
        } catch (e) { return iso; }
    }

    function badgeClass(t) {
        if (t === 'login') return 'b-login';
        if (t === 'entry') return 'b-entry';
        if (t === 'operation') return 'b-operation';
        if (t === 'logout') return 'b-logout';
        return 'b-other';
    }

    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function render(rows) {
        var tb = $('tbody');
        currentRows = rows || [];
        if (!currentRows.length) {
            tb.innerHTML = '<tr><td colspan="6" class="empty">暂无数据（可调整筛选条件）</td></tr>';
            $('statBadge').innerHTML = '';
            return;
        }
        var html = '';
        currentRows.forEach(function (r) {
            var email = r.email || '-';
            html += '<tr>'
                + '<td style="white-space:nowrap;">' + esc(fmtTime(r.created_at)) + '</td>'
                + '<td class="email-cell">' + esc(email) + '</td>'
                + '<td><span class="b ' + badgeClass(r.event_type) + '">' + esc(TYPE_LABEL[r.event_type] || r.event_type || '-') + '</span></td>'
                + '<td>' + esc(r.action || '-') + '</td>'
                + '<td class="detail-cell">' + esc(r.detail || '') + '</td>'
                + '<td style="white-space:nowrap;">' + esc(r.ip || '-') + '</td>'
                + '</tr>';
        });
        tb.innerHTML = html;

        // 类型分布
        var counts = {};
        currentRows.forEach(function (r) { counts[r.event_type] = (counts[r.event_type] || 0) + 1; });
        var badges = Object.keys(counts).map(function (k) {
            return '<span class="b ' + badgeClass(k) + '" style="margin-right:4px;">' + esc(TYPE_LABEL[k] || k) + ' ' + counts[k] + '</span>';
        }).join('');
        $('statBadge').innerHTML = badges;
    }

    function search(page) {
        if (busy) return;
        var limit = parseInt($('fLimit').value, 10) || 100;
        var offset = page * limit;
        if (offset < 0) return;

        busy = true;
        clearMsg();
        $('statInfo').textContent = '查询中……';

        var params = {
            limit: limit,
            offset: offset
        };
        var em = $('fEmail').value.trim();
        if (em) params.email = em;
        var tp = $('fType').value;
        if (tp) params.type = tp;
        var from = $('fFrom').value;
        if (from) params.from = from;
        var to = $('fTo').value;
        if (to) params.to = to;

        window.fetchLogs(params).then(function (data) {
            busy = false;
            currentPage = page;
            render(data.rows || []);
            var fromN = offset + 1;
            var toN = offset + (data.rows || []).length;
            $('statInfo').textContent = '显示第 ' + fromN + ' - ' + toN + ' 条（共拉取 ' + (data.rows || []).length + ' 条）';
            $('btnPrev').disabled = (currentPage === 0);
            $('btnNext').disabled = ((data.rows || []).length < limit);
        }).catch(function (err) {
            busy = false;
            render([]);
            $('statInfo').textContent = '';
            if (err && err.message === 'FORBIDDEN') showMsg('err', '无访问权限：当前账号不是教师管理员。');
            else if (err && err.message === 'NO_USER') showMsg('err', '登录已失效，请重新登录。');
            else showMsg('err', '查询失败：' + (err && err.message || '未知错误'));
        });
    }

    function exportCsv() {
        var params = { limit: 500 };
        var em = $('fEmail').value.trim();
        if (em) params.email = em;
        var tp = $('fType').value;
        if (tp) params.type = tp;
        var from = $('fFrom').value;
        if (from) params.from = from;
        var to = $('fTo').value;
        if (to) params.to = to;

        window.fetchLogs(params).then(function (data) {
            var rows = data.rows || [];
            if (!rows.length) { showMsg('info', '当前筛选条件下没有可导出的数据。'); return; }
            var head = ['时间', '邮箱', '类型', '动作', '明细', 'IP'];
            var lines = rows.map(function (r) {
                return [fmtTime(r.created_at), r.email, TYPE_LABEL[r.event_type] || r.event_type, r.action, r.detail, r.ip]
                    .map(function (v) {
                        var s = String(v == null ? '' : v);
                        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
                    }).join(',');
            });
            var csv = '\ufeff' + head.join(',') + '\n' + lines.join('\n');
            var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            var d = new Date();
            var stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            a.download = '平台日志_' + stamp + '.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
            showMsg('ok', '已导出 ' + rows.length + ' 条记录到 CSV 文件。');
        }).catch(function (err) {
            if (err && err.message === 'FORBIDDEN') showMsg('err', '无访问权限：当前账号不是教师管理员。');
            else showMsg('err', '导出失败：' + (err && err.message || '未知错误'));
        });
    }

    function checkAccess() {
        var u = currentUser();
        if (!u) {
            $('guestView').style.display = 'block';
            $('deniedView').style.display = 'none';
            $('mainView').style.display = 'none';
            $('barEmail').textContent = '';
            return;
        }
        $('barEmail').textContent = u.email;
        $('guestView').style.display = 'none';

        window.fetchSelf().then(function (info) {
            if (!info) { showMsg('err', '无法连接日志服务，请确认站点 Functions 已部署。'); return; }
            if (info.admin) {
                $('deniedView').style.display = 'none';
                $('mainView').style.display = 'block';
                clearMsg();
                search(0);
            } else {
                $('deniedView').style.display = 'block';
                $('mainView').style.display = 'none';
            }
        }).catch(function () {
            showMsg('err', '身份校验失败，请刷新重试。');
        });
    }

    onReady(function () {
        if (typeof netlifyIdentity === 'undefined') {
            showMsg('err', '当前为本地预览模式：日志后台需部署到 Netlify 并开启 Identity 服务后可用。');
            $('guestView').style.display = 'block';
            return;
        }
        netlifyIdentity.on('login', checkAccess);
        netlifyIdentity.on('logout', function () {
            $('mainView').style.display = 'none';
            $('deniedView').style.display = 'none';
            $('guestView').style.display = 'block';
            $('barEmail').textContent = '';
        });
        checkAccess();
    });

    window.doLogin = doLogin;
    window.search = search;
    window.exportCsv = exportCsv;
})();
</script>
</body>
</html>
